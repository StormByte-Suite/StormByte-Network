name: CI

permissions:
  actions: write
  contents: read

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]
  workflow_dispatch:

env:
  BUILD_TYPE: Release

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ###########################################################################
  # Bootstraps
  # Submodule cache is OS-scoped by Actions — one warm job per OS.
  ###########################################################################
  checkout-bootstrap:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-26.04, ubuntu-26.04-arm, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    name: checkout-bootstrap (${{ matrix.os }})
    steps:
      - name: Warm submodule / checkout cache
        uses: stormbytepp/githubactions/.github/actions/checkout-cached@master
        with:
          fetch-depth: 1
          submodules: recursive

  apt-bootstrap:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-26.04, ubuntu-26.04-arm]
    runs-on: ${{ matrix.runner }}
    name: apt-bootstrap (${{ matrix.runner }})
    steps:
      - name: Warm APT lists cache
        uses: stormbytepp/githubactions/.github/actions/update-apt-cached@master
        with:
          cache-key: apt-lists

  ###########################################################################
  # Linux
  ###########################################################################
  build-linux:
    needs: [checkout-bootstrap, apt-bootstrap]
    strategy:
      fail-fast: false
      matrix:
        platform:
          - runner: ubuntu-26.04
            arch: amd64
          - runner: ubuntu-26.04-arm
            arch: arm64
        libc: [glibc, musl]
        toolchain:
          - compiler: gcc
            stdlib: libstdc++
          - compiler: clang
            stdlib: libc++
        include:
          - platform:
              runner: ubuntu-26.04
              arch: amd64
            libc: glibc
            toolchain:
              compiler: clang
              stdlib: libstdc++
    runs-on: ${{ matrix.platform.runner }}
    name: linux-${{ matrix.platform.arch }}-${{ matrix.libc }}-${{ matrix.toolchain.compiler }}-${{ matrix.toolchain.stdlib }}
    steps:
      - name: Checkout repository and submodules
        uses: stormbytepp/githubactions/.github/actions/checkout-cached@master
        with:
          fetch-depth: 1
          submodules: recursive

      - name: Add shared library directories
        shell: bash
        run: |
          set -euo pipefail
          # Append. Assigning the variable would drop a path already set.
          add_dir() {
            local name="$1" dir="$2" current
            current="$(printenv "$name" || true)"
            case ":${current}:" in
              *":${dir}:"*) return 0 ;;
            esac
            if [[ -n "$current" ]]; then
              current="${current}:${dir}"
            else
              current="${dir}"
            fi
            export "${name}=${current}"
            echo "${name}=${current}" >> "$GITHUB_ENV"
          }
          for name in LD_LIBRARY_PATH DYLD_LIBRARY_PATH; do
            add_dir "$name" "${{ github.workspace }}/build/lib"
            add_dir "$name" "${{ github.workspace }}/build/buildmaster/install/lib"
            add_dir "$name" "${{ github.workspace }}/build/buildmaster/install/lib64"
          done

      - name: Build with toolchain
        uses: stormbytepp/githubactions/.github/actions/build-with-toolchain@master
        with:
          compiler: ${{ matrix.toolchain.compiler }}
          cxx-stdlib: ${{ matrix.toolchain.stdlib }}
          libc: ${{ matrix.libc }}
          compiler-cache-key: network-v1
          compiler-cache-scope: ${{ matrix.platform.arch }}-${{ matrix.libc }}-${{ matrix.toolchain.compiler }}-${{ matrix.toolchain.stdlib }}
          buildmaster-cache-key: bm-network-${{ matrix.platform.arch }}-${{ matrix.libc }}-${{ matrix.toolchain.compiler }}-${{ matrix.toolchain.stdlib }}
          build-type: ${{ env.BUILD_TYPE }}
          pgo: false
          lto: true
          cpu-baseline: auto
          cmake-options: >-
            -DENABLE_TEST=ON
            -DENABLE_CI_FIXTURES=ON
            -DWITH_STORMBYTE=BUNDLED
            -DWITH_NGHTTP2=BUNDLED
            -DBUILD_SHARED_LIBS=ON
          ctest: true
          ctest-options: --output-on-failure --timeout 300 --test-dir ${{ github.workspace }}/build/test

  ###########################################################################
  # macOS
  ###########################################################################
  build-macos:
    needs: [checkout-bootstrap]
    runs-on: macos-latest
    name: macos-clang-BUNDLED
    steps:
      - name: Checkout repository and submodules
        uses: stormbytepp/githubactions/.github/actions/checkout-cached@master
        with:
          fetch-depth: 1
          submodules: recursive

      - name: Add shared library directories
        shell: bash
        run: |
          set -euo pipefail
          # Append. Assigning the variable would drop a path already set.
          add_dir() {
            local name="$1" dir="$2" current
            current="$(printenv "$name" || true)"
            case ":${current}:" in
              *":${dir}:"*) return 0 ;;
            esac
            if [[ -n "$current" ]]; then
              current="${current}:${dir}"
            else
              current="${dir}"
            fi
            export "${name}=${current}"
            echo "${name}=${current}" >> "$GITHUB_ENV"
          }
          for name in LD_LIBRARY_PATH DYLD_LIBRARY_PATH; do
            add_dir "$name" "${{ github.workspace }}/build/lib"
            add_dir "$name" "${{ github.workspace }}/build/buildmaster/install/lib"
            add_dir "$name" "${{ github.workspace }}/build/buildmaster/install/lib64"
          done

      - name: Build with toolchain
        uses: stormbytepp/githubactions/.github/actions/build-with-toolchain@master
        with:
          compiler: clang
          compiler-cache-key: network-v1
          buildmaster-cache-key: bm-network-macos-clang
          build-type: ${{ env.BUILD_TYPE }}
          pgo: false
          lto: true
          cpu-baseline: auto
          cmake-options: >-
            -DENABLE_TEST=ON
            -DENABLE_CI_FIXTURES=ON
            -DWITH_STORMBYTE=BUNDLED
            -DWITH_NGHTTP2=BUNDLED
            -DBUILD_SHARED_LIBS=ON
          ctest: true
          ctest-options: --output-on-failure --timeout 300 --test-dir ${{ github.workspace }}/build/test

      - name: Diagnose macOS TLS fixture rejection
        if: failure()
        shell: bash
        run: |
          /usr/bin/security verify-cert \
            -c test/fixtures/tls/server.pem \
            -r test/fixtures/tls/ca.pem \
            -p ssl -s localhost -L -v

  ###########################################################################
  # Windows
  ###########################################################################
  build-windows:
    needs: [checkout-bootstrap]
    runs-on: windows-latest
    name: windows-clang-cl-BUNDLED

    steps:
      - name: Checkout repository and submodules
        uses: stormbytepp/githubactions/.github/actions/checkout-cached@master
        with:
          fetch-depth: 1
          submodules: recursive

      - name: Add DLL directories to PATH
        shell: pwsh
        run: |
          echo "${{ github.workspace }}\build\lib" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          echo "${{ github.workspace }}\build\buildmaster\install\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Build with toolchain
        uses: stormbytepp/githubactions/.github/actions/build-with-toolchain@master
        with:
          compiler: clang-cl
          compiler-cache-key: network-v1
          buildmaster-cache-key: bm-network-windows-clang-cl
          build-type: ${{ env.BUILD_TYPE }}
          pgo: false
          lto: true
          cpu-baseline: auto
          cmake-options: >-
            -DENABLE_TEST=ON
            -DENABLE_CI_FIXTURES=ON
            -DWITH_STORMBYTE=BUNDLED
            -DWITH_NGHTTP2=BUNDLED
            -DBUILD_SHARED_LIBS=ON
          ctest: true
          ctest-options: --output-on-failure --timeout 300 --test-dir ${{ github.workspace }}/build/test
