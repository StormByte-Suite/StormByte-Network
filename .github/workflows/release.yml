name: Release

# Manual only. In the Actions tab, pick a tag. master (or any branch)
# fails before the build. The zips replace the assets of that tag's release,
# which does not have to be the latest. A retag of the same name is replaced.
#
# Each build installs and uploads its own ZIP to the release.
# Docs are deployed independently for this tag.

on:
  workflow_dispatch:

permissions:
  actions: write
  contents: read
  pages: write
  id-token: write

env:
  BUILD_TYPE: Release

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - name: Require a tag
        run: |
          set -euo pipefail
          if [ "${{ github.ref_type }}" != "tag" ]; then
            echo "::error::Selected ref is '${{ github.ref_name }}'. Run this workflow on a tag, not on master."
            exit 1
          fi
          echo "Release tag: ${{ github.ref_name }}"

  ###########################################################################
  # Bootstraps (warm shared caches; other jobs still check out on their runner)
  # Submodule cache is OS-scoped by Actions — one warm job per OS.
  ###########################################################################
  checkout-bootstrap:
    needs: guard
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-26.04, ubuntu-26.04-arm, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    name: checkout-bootstrap (${{ matrix.os }})
    steps:
      - name: Warm submodule / checkout cache
        uses: stormbytepp/githubactions/.github/actions/checkout-cached@master
        with:
          fetch-depth: 1
          submodules: recursive

  apt-bootstrap:
    needs: guard
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-26.04, ubuntu-26.04-arm]
    runs-on: ${{ matrix.runner }}
    name: apt-bootstrap (${{ matrix.runner }})
    steps:
      - name: Warm APT lists cache
        uses: stormbytepp/githubactions/.github/actions/update-apt-cached@master
        with:
          cache-key: apt-lists

  ###########################################################################
  # Linux
  # Name: <component>-<tag>-<os>-<arch>-<libc>-<stdlib>.zip
  # libstdc++ and libc++ are both in the filename. Windows has one ABI and no suffix.
  ###########################################################################
  build-linux:
    needs: [checkout-bootstrap, apt-bootstrap]
    permissions:
      actions: write
      contents: write
    strategy:
      fail-fast: false
      matrix:
        platform:
          - runner: ubuntu-26.04
            arch: amd64
          - runner: ubuntu-26.04-arm
            arch: arm64
        libc: [glibc, musl]
        toolchain:
          - compiler: gcc
            stdlib: libstdc++
          - compiler: clang
            stdlib: libc++
    runs-on: ${{ matrix.platform.runner }}
    name: linux-${{ matrix.platform.arch }}-${{ matrix.libc }}-${{ matrix.toolchain.stdlib }}
    steps:
      - name: Checkout repository and submodules
        uses: stormbytepp/githubactions/.github/actions/checkout-cached@master
        with:
          fetch-depth: 1
          submodules: recursive

      - name: Add shared library directories
        shell: bash
        run: |
          set -euo pipefail
          # Prepend. A job-level assignment replaces the variable and
          # drops whatever the runner or a previous step already set.
          # /usr/lib/llvm-22/lib holds LLVM libunwind. libc++ needs it
          # and the default loader does not search that directory.
          # The toolchain creates it later; tests only need the entry.
          extra="/usr/lib/llvm-22/lib:${{ github.workspace }}/build/pgo-instr/lib:${{ github.workspace }}/build/pgo-instr/buildmaster/install/lib:${{ github.workspace }}/build/pgo-instr/buildmaster/install/lib64:${{ github.workspace }}/build/lib:${{ github.workspace }}/build/buildmaster/install/lib:${{ github.workspace }}/build/buildmaster/install/lib64"
          for name in LD_LIBRARY_PATH DYLD_LIBRARY_PATH; do
            current="$(printenv "$name" 2>/dev/null || true)"
            if [[ -n "${current}" ]]; then
              echo "${name}=${extra}:${current}" >> "$GITHUB_ENV"
            else
              echo "${name}=${extra}" >> "$GITHUB_ENV"
            fi
          done

      - name: Build and deploy with toolchain
        uses: stormbytepp/githubactions/.github/actions/build-with-toolchain@master
        with:
          compiler: ${{ matrix.toolchain.compiler }}
          cxx-stdlib: ${{ matrix.toolchain.stdlib }}
          libc: ${{ matrix.libc }}
          compiler-cache-key: network-v1
          compiler-cache-scope: release-${{ matrix.platform.arch }}-${{ matrix.libc }}-${{ matrix.toolchain.compiler }}-${{ matrix.toolchain.stdlib }}
          buildmaster-cache-key: bm-network-release-${{ matrix.platform.arch }}-${{ matrix.libc }}-${{ matrix.toolchain.compiler }}-${{ matrix.toolchain.stdlib }}
          build-type: ${{ env.BUILD_TYPE }}
          pgo: true
          lto: true
          cpu-baseline: auto
          cmake-options: >-
            -DWITH_STORMBYTE=BUNDLED
            -DWITH_NGHTTP2=BUNDLED
            -DBUILD_SHARED_LIBS=ON
          ctest: false
          install-prefix: package
          deploy: true

  ###########################################################################
  # macOS
  # Apple Clang only. One archive, no standard-library suffix.
  ###########################################################################
  build-macos:
    needs: [checkout-bootstrap]
    permissions:
      actions: write
      contents: write
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - compiler: clang
            asset: macos-arm64
    name: macos
    steps:
      - name: Checkout repository and submodules
        uses: stormbytepp/githubactions/.github/actions/checkout-cached@master
        with:
          fetch-depth: 1
          submodules: recursive

      - name: Add shared library directories
        shell: bash
        run: |
          set -euo pipefail
          # Prepend. A job-level assignment replaces the variable and
          # drops whatever the runner or a previous step already set.
          extra="${{ github.workspace }}/build/lib:${{ github.workspace }}/build/buildmaster/install/lib:${{ github.workspace }}/build/buildmaster/install/lib64"
          for name in LD_LIBRARY_PATH DYLD_LIBRARY_PATH; do
            current="$(printenv "$name" 2>/dev/null || true)"
            if [[ -n "${current}" ]]; then
              echo "${name}=${extra}:${current}" >> "$GITHUB_ENV"
            else
              echo "${name}=${extra}" >> "$GITHUB_ENV"
            fi
          done

      - name: Build and deploy with toolchain
        uses: stormbytepp/githubactions/.github/actions/build-with-toolchain@master
        with:
          compiler: ${{ matrix.compiler }}
          compiler-cache-key: network-v1
          buildmaster-cache-key: bm-network-release-macos-${{ matrix.compiler }}
          build-type: ${{ env.BUILD_TYPE }}
          pgo: true
          lto: true
          cpu-baseline: auto
          cmake-options: >-
            -DWITH_STORMBYTE=BUNDLED
            -DWITH_NGHTTP2=BUNDLED
            -DBUILD_SHARED_LIBS=ON
          ctest: false
          install-prefix: package
          deploy: true

  ###########################################################################
  # Windows
  ###########################################################################
  build-windows:
    needs: [checkout-bootstrap]
    permissions:
      actions: write
      contents: write
    runs-on: windows-latest
    name: windows-clang-cl

    steps:
      - name: Checkout repository and submodules
        uses: stormbytepp/githubactions/.github/actions/checkout-cached@master
        with:
          fetch-depth: 1
          submodules: recursive

      - name: Add DLL directories to PATH
        shell: pwsh
        run: |
          echo "${{ github.workspace }}\build\lib" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          echo "${{ github.workspace }}\build\buildmaster\install\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Build and deploy with toolchain
        uses: stormbytepp/githubactions/.github/actions/build-with-toolchain@master
        with:
          compiler: clang-cl
          compiler-cache-key: network-v1
          buildmaster-cache-key: bm-network-release-windows-clang-cl
          build-type: ${{ env.BUILD_TYPE }}
          pgo: true
          lto: true
          cpu-baseline: auto
          cmake-options: >-
            -DWITH_STORMBYTE=BUNDLED
            -DWITH_NGHTTP2=BUNDLED
            -DBUILD_SHARED_LIBS=ON
          ctest: false
          install-prefix: package
          deploy: true

  ###########################################################################
  # Docs (StormByteNetworkDoc) — Linux + same APT lists cache. Independent of the zips.
  ###########################################################################
  docs:
    needs: [guard, checkout-bootstrap, apt-bootstrap]
    uses: stormbytepp/githubactions/.github/workflows/generate-and-deploy-docs.yml@master
    with:
      doc_target: StormByteNetworkDoc
      extra-cmake-options: >-
        -DENABLE_DOC=ON
        -DWITH_STORMBYTE=BUNDLED
        -DWITH_NGHTTP2=BUNDLED
      docs_output_dir: ./_site
